# ============================================================
#  前端容器（Nginx）站点配置
#
#  它干两件事：
#    ① 把 web/ 里的静态页面发给浏览器
#    ② 把 /api 和 /ws 转发给后端容器
#       —— 这里的 backend 是 Compose 里的服务名，Compose 会自动做 DNS 解析，
#          不需要写 IP，后端容器重启换 IP 也不受影响
# ============================================================
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index login.html;
    charset utf-8;

    # 页面不缓存：改了文件刷新就生效，方便调试
    add_header Cache-Control "no-cache, no-store, must-revalidate";

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- ① 静态页面 ----------
    location / {
        try_files $uri $uri/ =404;
    }

    # 管理后台：访问 /admin 时返回 web/admin.html
    location = /admin  { try_files /admin.html =404; }
    location = /admin/ { try_files /admin.html =404; }

    # ---------- ② 后端 HTTP 接口 ----------
    location /api/ {
        proxy_pass http://backend:8082;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 回答是「流式」返回的，不能让 Nginx 攒够一批再往下发，
        # 否则前端就看不到打字机效果了
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ---------- ③ WebSocket 长连接 ----------
    location /ws {
        proxy_pass http://backend:8082;
        proxy_http_version 1.1;

        # 这两行是 WebSocket 能"升级"成功的关键，缺一不可
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 聊天室可能长时间没人说话，Nginx 默认 60 秒没数据就断开，
        # 必须放大，否则用户会莫名其妙掉线
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
