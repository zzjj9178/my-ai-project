<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的第一个 AI 智能应用</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(135deg,#eef2ff,#fdf2f8);
    display: flex; align-items: center; justify-content: center;
    height: 100vh; margin: 0; color: #6b7280; font-size: .9em;
  }
  .box { text-align: center; }
  .spin {
    width: 34px; height: 34px; margin: 0 auto 14px;
    border: 3px solid #e0e7ff; border-top-color: #6366f1;
    border-radius: 50%; animation: r .8s linear infinite;
  }
  @keyframes r { to { transform: rotate(360deg) } }
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <div id="tip">正在进入…</div>
</div>

<script src="common.js"></script>
<script>
// 入口页：已登录进主页，未登录去登录页
(async () => {
  const tip = document.getElementById('tip');
  tip.textContent = '正在连接后端…';
  const ok = await tryRestore();
  location.href = ok ? 'home.html' : 'login.html';
})();
</script>
</body>
</html>
